*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font-body)}
button,th{font-family:inherit}
#progress{position:fixed;left:0;bottom:0;height:4px;background:var(--accent);z-index:100;transition:width .25s ease}
#section-tag{position:fixed;top:18px;left:24px;color:var(--text-dim);font-weight:700;font-size:var(--t4);font-family:var(--font-mono);letter-spacing:.12em;z-index:100}
#pageInfo{position:fixed;right:24px;bottom:18px;color:var(--text-dim);font-weight:700;font-size:var(--t4);font-family:var(--font-mono);z-index:100}
.deck-ui-hidden{display:none!important}
.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:80px 100px;opacity:0;pointer-events:none;transform:translateY(16px);transition:opacity .45s ease,transform .45s ease;overflow:hidden;background:var(--bg)}
.slide:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgb(var(--accent-rgb) / .08) 0 1px,transparent 1px) 0 0 / 72px 72px;pointer-events:none}
.slide.active{opacity:1;pointer-events:auto;transform:translateY(0)}
.slide-inner{width:100%;max-width:1320px;position:relative;z-index:2}
.full-img{position:absolute;inset:0;z-index:0;background:var(--bg-card-alt)}
.full-img img{width:100%;height:100%;object-fit:cover;opacity:.86}
.full-img:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 0%,rgb(var(--bg-rgb) / .85) 48%,rgb(var(--bg-rgb) / .2) 100%)}
.kicker{display:inline-flex;align-items:center;gap:.5rem;color:var(--text-dim);font-weight:700;font-size:var(--t4);font-family:var(--font-mono);letter-spacing:0;margin-bottom:18px;padding:6px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-card)}
.kicker:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
h1{font-family:var(--font-title);font-size:var(--t1);line-height:1.08;margin:0;font-weight:900;letter-spacing:0}
h2{font-family:var(--font-title);font-size:var(--t2);line-height:1.2;margin:0;font-weight:800}
.lead{font-size:var(--t3);line-height:1.6;color:var(--text-dim);max-width:820px;margin:24px 0 0}
.gradient{color:var(--accent)}
.big-question{text-align:center}
.big-question h1{font-size:64px}
.big-question .lead{margin-left:auto;margin-right:auto}
.focus-card{max-width:960px;margin:0 auto;padding:32px 36px;background:var(--bg-card);border:1px solid var(--border);border-left:8px solid var(--accent);border-radius:var(--radius)}
.focus-card h1{margin-bottom:12px}
.focus-card .lead{max-width:none;margin-top:0}
.instructor-layout{display:grid;grid-template-columns:.78fr 1.22fr;gap:44px;align-items:center}
.instructor-avatar{aspect-ratio:1;border-radius:50%;overflow:hidden;background:var(--bg-card-alt);border:1px solid var(--border)}
.instructor-avatar img{width:100%;height:100%;object-fit:cover}
.instructor-bio{margin-top:22px;font-size:18px;line-height:1.7;color:var(--text-dim)}
.instructor-meta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.instructor-meta span,.instructor-meta a{display:inline-flex;align-items:center;min-height:36px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-card);color:var(--text-dim);font-weight:800;font-size:14px;text-decoration:none}
.social-links{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:18px}
.social-links a{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:160px;min-height:38px;padding:8px 12px;border:1px solid rgb(var(--accent-rgb) / .35);border-radius:999px;background:var(--bg-card);color:var(--accent);text-decoration:none;font-weight:900;transition:transform .18s ease,border-color .18s ease,background .18s ease}
.social-links a:hover{transform:translateY(-2px);border-color:var(--accent);background:rgb(var(--accent-rgb) / .06)}
.social-links svg{width:17px;height:17px;flex:0 0 17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.social-links .solid-icon{fill:currentColor;stroke:none}
.instructor-links{justify-content:flex-start}
.split{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.split.flip .text{order:1}
.split.flip .split-img{order:2}
.split-img,.support-img{position:relative;aspect-ratio:16/10;border-radius:var(--radius);overflow:hidden;background:var(--bg-card-alt);border:1px solid var(--border)}
.split-img img,.support-img img{width:100%;height:100%;object-fit:cover}
.slide img{cursor:zoom-in}
.img-tag{position:absolute;top:16px;left:16px;background:rgba(255,255,255,.9);color:var(--accent);padding:6px 12px;border-radius:6px;font-weight:700;font-size:11px;font-family:var(--font-mono);letter-spacing:0}
.list{list-style:none;margin:24px 0 0;padding:0}
.list li{font-size:20px;color:var(--text);line-height:1.45;padding:12px 0;border-top:1px solid var(--border)}
.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:48px}
.type-card,.soil-step{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;cursor:pointer;transition:transform .2s ease,border-color .2s ease,background .2s ease}
.type-card:hover{transform:translateY(-4px);border-color:var(--accent)}
.card-img{aspect-ratio:16/10;border-radius:8px;overflow:hidden;margin-bottom:18px;background:var(--bg-card-alt);border:1px solid var(--border)}
.card-img img{width:100%;height:100%;object-fit:cover}
.badge{display:inline-block;font-weight:800;font-size:var(--t4);font-family:var(--font-mono);color:var(--accent);background:var(--bg-card);border:1px solid rgb(var(--accent-rgb) / .35);padding:4px 10px;border-radius:6px;margin-bottom:12px}
.type-card:nth-child(2) .badge{color:var(--text);border-color:var(--border)}
.type-card:nth-child(3) .badge{color:var(--accent3);border-color:var(--border)}
.type-card h3,.soil-step h3{font-family:var(--font-title);font-size:22px;margin:0 0 10px}
.type-card p,.soil-step p{font-size:15px;line-height:1.6;color:var(--text-dim);margin:0}
.compare-layout{display:grid;grid-template-columns:.85fr 1.15fr;gap:48px;align-items:center}
table.compare{width:100%;border-collapse:collapse;margin-top:24px;font-size:18px}
table.compare th,table.compare td{padding:15px 16px;text-align:left;border-bottom:1px solid var(--border)}
table.compare th{color:var(--accent);font-weight:800;font-size:13px;font-family:var(--font-mono);cursor:pointer;user-select:none}
table.compare th:hover{color:var(--accent2)}
table.compare tr:hover td{background:rgb(var(--accent-rgb) / .06)}
.yes{color:var(--good);font-weight:900}
.no{color:var(--text-dim)}
.mid{color:var(--warn);font-weight:900}
.action-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:34px}
.action-card{min-height:250px;padding:24px;border-radius:var(--radius);background:var(--bg-card);border:1px solid var(--border);border-top:6px solid var(--accent)}
.action-card .num{display:inline-flex;width:34px;height:34px;align-items:center;justify-content:center;border-radius:50%;background:rgb(var(--accent-rgb) / .15);color:var(--accent);font-weight:900;font-size:14px;font-family:var(--font-mono);margin-bottom:18px}
.action-card h2{font-size:28px;margin-bottom:14px}
.action-card p{font-size:19px;line-height:1.65;color:var(--text-dim);margin:0}
.soil-flow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:32px}
.soil-step{border-top:3px solid var(--accent);cursor:default}
.soil-step:nth-child(2n){border-top-color:var(--accent2)}
.soil-step .num{font-weight:900;font-size:var(--t4);font-family:var(--font-mono);color:var(--accent)}
.video-layout{display:grid;grid-template-columns:1.25fr .75fr;gap:40px;align-items:center}
.video-media{display:flex;flex-direction:column;align-items:stretch}
.video-frame{aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;background:#050505;border:1px solid var(--border);box-shadow:0 20px 80px rgb(0 0 0 / .35)}
.video-frame video,.video-frame iframe{width:100%;height:100%;display:block;border:0;background:#000}
.video-tools{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}
.youtube-open{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:9px 14px;border-radius:999px;border:1px solid rgb(var(--accent-rgb) / .48);background:rgb(0 0 0 / .74);color:var(--accent2);text-decoration:none;font-size:14px;font-weight:900;box-shadow:0 8px 28px rgb(0 0 0 / .28)}
.youtube-open:hover{border-color:var(--accent);background:rgb(var(--accent-rgb) / .16);color:#fff}
.watch-list{display:grid;gap:14px;margin-top:26px}
.watch-item{padding:18px 20px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-card)}
.watch-item h3{font-size:20px;margin:0 0 8px}
.watch-item p{font-size:16px;line-height:1.6;color:var(--text-dim);margin:0}
.back-cover{align-items:stretch}
.back-cover .closing{height:100%;max-width:none;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:72px 72px 160px;text-align:center}
.back-cover-title{display:flex;align-items:center;justify-content:center;gap:clamp(20px,2.5vw,40px);white-space:nowrap;font-size:clamp(56px,6.4vw,104px);line-height:1.02;font-weight:900}
.back-cover-emblem{width:clamp(72px,7vw,120px);height:clamp(72px,7vw,120px);object-fit:contain}
.back-cover-socials{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);width:min(980px,calc(100% - 160px));margin:0;padding:24px 30px;border-top:1px solid rgb(var(--accent-rgb) / .28);text-align:center;background:rgb(var(--accent-rgb) / .03)}
.back-cover-socials p{font-size:18px;line-height:1.55;color:var(--text-dim);font-weight:800;margin:0}

/* Markdown compiler elements inside slides */
.prompt-block{width:100%;background:#1e1e1e;color:#d4d4d4;border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;text-align:left;font-family:var(--font-mono);box-shadow:0 8px 30px rgba(0,0,0,.15)}
.prompt-header{display:flex;align-items:center;padding:12px 16px;background:#252526;border-bottom:1px solid #2d2d2d;font-size:12px;color:#858585;position:relative}
.prompt-header .dots{display:flex;gap:6px;margin-right:16px}
.prompt-header .dots span{width:10px;height:10px;border-radius:50%;background:#ff5f56}
.prompt-header .dots span:nth-child(2){background:#ffbd2e}
.prompt-header .dots span:nth-child(3){background:#27c93f}
.prompt-header .label{margin-left:auto;background:rgba(255,255,255,.08);padding:2px 8px;border-radius:4px}
.prompt-body{padding:18px 24px;font-size:15px;line-height:1.6;white-space:pre-wrap}
.insight{background:var(--bg-card-alt);border-left:5px solid var(--accent);padding:24px;border-radius:var(--radius);margin-top:20px;text-align:left}
.insight-title{font-size:20px;font-weight:800;margin-bottom:12px}
.insight p{font-size:16px;line-height:1.6;margin:0;color:var(--text-dim)}
.insight ul{margin:12px 0 0;padding-left:20px}
.insight li{font-size:16px;line-height:1.6;color:var(--text-dim)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.tag{display:inline-block;padding:6px 14px;border-radius:20px;font-size:14px;font-weight:700}
.tag.orange{background:rgba(232,132,90,.12);color:#e8845a;border:1px solid rgba(232,132,90,.3)}
.tag.purple{background:rgba(147,112,219,.12);color:#9370db;border:1px solid rgba(147,112,219,.3)}
.tag.green{background:rgba(46,139,87,.12);color:#2e8b57;border:1px solid rgba(46,139,87,.3)}
.tag.blue{background:rgba(30,144,255,.12);color:#1e90ff;border:1px solid rgba(30,144,255,.3)}
.checklist{list-style:none;padding:0;margin:20px 0 0;text-align:left}
.checklist li{position:relative;padding-left:32px;font-size:18px;line-height:1.6;margin-bottom:12px;color:var(--text)}
.checklist li:before{content:"✓";position:absolute;left:4px;top:0;color:var(--accent);font-weight:900;font-size:18px}
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:32px;text-align:left}
.summary-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:24px}
.summary-card .sc-icon{font-size:32px;margin-bottom:12px}
.summary-card h4{font-size:18px;margin:0 0 8px;font-weight:800}
.summary-card p{font-size:14px;line-height:1.6;color:var(--text-dim);margin:0}

/* Copy button for code prompts */
.copy-btn{background:none;border:none;color:#858585;cursor:pointer;padding:4px;margin-left:8px;display:flex;align-items:center;justify-content:center;border-radius:4px;transition:background .2s,color .2s}
.copy-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.copy-btn.copied{color:#27c93f}

@media(max-width:900px){
  .slide{padding:48px 24px}
  h1{font-size:36px}
  .big-question h1{font-size:38px}
  .lead{font-size:17px}
  .focus-card{padding:24px}
  .split,.compare-layout,.three-col,.soil-flow,.action-grid,.instructor-layout,.video-layout,.summary-grid{grid-template-columns:1fr}
  .instructor-avatar{width:min(220px,70vw);justify-self:center}
  .action-card{min-height:auto}
  .split.flip .text,.split.flip .split-img{order:initial}
}
</style>
</head>
<body>
<div id="progress"></div>
<div id="section-tag"></div>
<div id="pageInfo"></div>
<main id="deck">
{{SLIDES}}
</main>
<script>
const slides=[...document.querySelectorAll('.slide')];
let cur=0;
const progressBar=document.getElementById('progress');
const sectionTagEl=document.getElementById('section-tag');
const pageInfoEl=document.getElementById('pageInfo');
function padPage(n){return String(n).padStart(2,'0')}
function goto(n){
  cur=Math.max(0,Math.min(slides.length-1,n-1));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  const slide=slides[cur];
  if(!slide) return;
  const isContent=slide.dataset.role==='content';
  progressBar.style.width=((cur+1)/slides.length*100)+'%';
  sectionTagEl.textContent=slide.dataset.navLabel || '';
  pageInfoEl.textContent=padPage(cur+1)+' / '+padPage(slides.length);
  sectionTagEl.classList.toggle('deck-ui-hidden',!isContent);
  pageInfoEl.classList.toggle('deck-ui-hidden',!isContent);
}
function next(){goto(cur+2)}
function prev(){goto(cur)}
addEventListener('keydown',e=>{
  if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();next()}
  if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();prev()}
  if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen?.()
});
addEventListener('click',e=>{
  if(e.target.closest('button,a,th,.type-card,.choice-card,.split-img,.support-img'))return;
  if(e.clientX>innerWidth*.7)next();
  if(e.clientX<innerWidth*.3)prev();
});
document.querySelectorAll('.slide img').forEach(img=>{
  img.addEventListener('click',e=>{
    e.preventDefault();
    e.stopPropagation();
    const url=img.currentSrc||img.src;
    window.open(url,'_blank','noopener');
  });
});
function sortTable(col){
  const body=document.querySelector('#compareBody');
  if(!body)return;
  const rows=[...body.rows].sort((a,b)=>a.cells[col].textContent.localeCompare(b.cells[col].textContent,'zh-Hant',{numeric:true}));
  body.replaceChildren(...rows);
}
function copyPrompt(btn) {
  const block = btn.closest('.prompt-block');
  const body = block.querySelector('.prompt-body');
  navigator.clipboard.writeText(body.innerText).then(() => {
    btn.classList.add('copied');
    setTimeout(() => btn.classList.remove('copied'), 2000);
  });
}
goto(1);
</script>
</body>
</html>
